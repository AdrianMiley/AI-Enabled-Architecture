title: AI Enabled Architecture
description: A framework for producing IT Architecture artefacts that are optimised for use with AI tools

# GitHub Pages settings
url: "https://AdrianMiley.github.io/AI-Enabled-Architecture/"

remote_theme: just-the-docs/just-the-docs
nav_enabled: true
heading_anchors: true
color_scheme: light
search_enabled: true

plugins:
  - jekyll-default-layout
  - jekyll-relative-links
relative_links:
  enabled: true

# Mermaid configuration : Pick an available version from https://cdn.jsdelivr.net/npm/mermaid/
mermaid:
  version: "11.16.0"

search:
  # Split pages into sections that can be searched individually
  # Supports 1 - 6, default: 2
  heading_level: 3
  # Maximum amount of previews per search result
  # Default: 3
  previews: 3
  # Maximum amount of words to display before a matched word in the preview
  # Default: 5
  preview_words_before: 5
  # Maximum amount of words to display after a matched word in the preview
  # Default: 10
  preview_words_after: 10